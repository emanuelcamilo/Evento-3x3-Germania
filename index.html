<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090a0c" />
    <meta name="description" content="Abertura do torneio de basquete 3x3." />
    <title>Torneio 3x3 | Abertura</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <main>
      <section class="intro" id="intro" aria-labelledby="intro-title">
        <div class="intro__texture" aria-hidden="true"></div>
        <div class="intro__court" aria-hidden="true"></div>
        <div class="intro__glow intro__glow--one" aria-hidden="true"></div>
        <div class="intro__glow intro__glow--two" aria-hidden="true"></div>
        <div class="intro__content">
          <!-- Troque o src por sua logo final quando ela estiver disponível. -->
          <img class="intro__logo" src="assets/images/placeholder-3x3-mark.svg" alt="Marca provisória do torneio 3x3" />
          <p class="intro__eyebrow">Basquete • 3 contra 3</p>
          <h1 class="intro__title" id="intro-title"><span>BEM-VINDO</span><span>AO TORNEIO</span></h1>
          <button class="intro__cta" id="enter-event" type="button">
            <span>Entrar no evento</span>
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" /></svg>
          </button>
        </div>
        <p class="intro__hint">Clique ou pressione Enter para continuar</p>
      </section>
      <!-- Espaço reservado: nenhuma seção do site é implementada nesta etapa. -->
      <section class="next-state" id="next-state" aria-labelledby="next-state-title" aria-hidden="true" inert tabindex="-1"><p id="next-state-title">Abertura concluída</p></section>
    </main>
    <script src="assets/js/intro.js"></script>
  </body>
</html>
